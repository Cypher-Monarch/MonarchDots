# ─────────────────────────────────────────────────────────────
# HYPRLOCK — Gruvbox / Glass
# ─────────────────────────────────────────────────────────────

general {
    ignore_empty_input = true

    # Keep the pointer visible so clickable music controls
    # can actually be used comfortably.
    hide_cursor = false
}


# ─────────────────────────────────────────────────────────────
# BACKGROUND
# ─────────────────────────────────────────────────────────────

background {
    monitor =

    path = $HOME/.config/misc/cache/blurred_wallpaper.png

    blur_passes = 2
    blur_size = 8

    brightness = 0.60
    contrast = 0.95
    vibrancy = 0.10
}


# ─────────────────────────────────────────────────────────────
# CLOCK
# ─────────────────────────────────────────────────────────────

label {
    monitor =

    text = $TIME

    color = rgb(250, 189, 47)

    font_size = 64
    font_family = JetBrainsMono Nerd Font

    position = 0, 365

    halign = center
    valign = center

    shadow_passes = 4
    shadow_size = 8
    shadow_color = rgb(29, 32, 33)
}


# ─────────────────────────────────────────────────────────────
# DATE
# ─────────────────────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:60000] echo "$(date '+%A  ·  %d %B %Y')"

    color = rgb(213, 196, 161)

    font_size = 13
    font_family = JetBrainsMono Nerd Font

    position = 0, 300

    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgb(29, 32, 33)
}


# ─────────────────────────────────────────────────────────────
# MAIN GLASS CARD
# ─────────────────────────────────────────────────────────────

shape {
    monitor =

    size = 390, 500

    color = rgba(50, 48, 47, 185)

    rounding = 30

    border_size = 1
    border_color = rgba(146, 131, 116, 95)

    position = 0, 15

    halign = center
    valign = center

    shadow_passes = 8
    shadow_size = 25
    shadow_color = rgba(29, 32, 33, 180)
    shadow_boost = 1.15
}


# ─────────────────────────────────────────────────────────────
# GOLD ACCENT
# ─────────────────────────────────────────────────────────────

shape {
    monitor =

    size = 150, 4

    color = rgb(250, 189, 47)

    rounding = 2

    position = 0, 255

    halign = center
    valign = center

    shadow_passes = 5
    shadow_size = 8
    shadow_color = rgba(250, 189, 47, 100)
}


# ─────────────────────────────────────────────────────────────
# PROFILE IMAGE
# ─────────────────────────────────────────────────────────────

image {
    monitor =

    path = $HOME/.config/misc/cache/pfp.png

    size = 190
    rounding = -1

    border_size = 3
    border_color = rgb(250, 189, 47)

    rotate = 0
    reload_time = -1

    position = 0, 110

    halign = center
    valign = center

    shadow_passes = 6
    shadow_size = 16
    shadow_color = rgb(29, 32, 33)
    shadow_boost = 1.25
}


# ─────────────────────────────────────────────────────────────
# SECONDARY PROFILE RING
# ─────────────────────────────────────────────────────────────

shape {
    monitor =

    size = 210, 210

    color = rgba(0, 0, 0, 0)

    rounding = -1

    border_size = 1
    border_color = rgba(131, 165, 152, 110)

    position = 0, 110

    halign = center
    valign = center
}


# ─────────────────────────────────────────────────────────────
# USERNAME
# ─────────────────────────────────────────────────────────────

label {
    monitor =

    text = $USER

    color = rgb(235, 219, 178)

    font_size = 21
    font_family = JetBrainsMono Nerd Font

    text_align = center

    position = 0, -20

    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgb(29, 32, 33)
}


# ─────────────────────────────────────────────────────────────
# PASSWORD FIELD
# ─────────────────────────────────────────────────────────────

input-field {
    monitor =

    size = 290, 56

    outline_thickness = 2

    dots_size = 0.28
    dots_spacing = 0.17
    dots_center = true
    dots_rounding = -1

    outer_color = rgb(250, 189, 47)
    inner_color = rgba(40, 40, 40, 210)

    font_color = rgb(235, 219, 178)
    font_family = JetBrainsMono Nerd Font

    fade_on_empty = true
    fade_timeout = 1000

    placeholder_text = <span foreground='##d5c4a1'>Enter password</span>

    hide_input = false

    rounding = 28

    check_color = rgb(131, 165, 152)
    fail_color = rgb(204, 36, 29)

    fail_text = <span foreground='##fb4934'><i>$FAIL</i> <b>($ATTEMPTS)</b></span>

    fail_transition = 300

    capslock_color = rgb(250, 189, 47)
    numlock_color = rgb(250, 189, 47)
    bothlock_color = rgb(250, 189, 47)

    invert_numlock = false
    swap_font_color = false

    position = 0, -120

    halign = center
    valign = center

    shadow_passes = 5
    shadow_size = 12
    shadow_color = rgb(29, 32, 33)
    shadow_boost = 1.1
}


# ─────────────────────────────────────────────────────────────
# KEYBOARD LAYOUT
# ─────────────────────────────────────────────────────────────

label {
    monitor =

    text = <span foreground='##83a598'>󰌌</span>  $LAYOUT

    color = rgb(213, 196, 161)

    font_size = 12
    font_family = JetBrainsMono Nerd Font

    position = 0, -195

    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgb(29, 32, 33)
}


# ─────────────────────────────────────────────────────────────
# MUSIC WIDGET
# ─────────────────────────────────────────────────────────────

# Music glass panel
shape {
    monitor =

    size = 390, 160

    color = rgba(50, 48, 47, 185)

    rounding = 24

    border_size = 1
    border_color = rgba(146, 131, 116, 80)

    position = 0, -330

    halign = center
    valign = center

    shadow_passes = 7
    shadow_size = 20
    shadow_color = rgba(29, 32, 33, 160)
    shadow_boost = 1.1
}


# Album artwork
image {
    monitor =

    path = /tmp/hyprlock-music-placeholder.jpg

    size = 120
    rounding = 18

    border_size = 2
    border_color = rgb(250, 189, 47)

    reload_time = 2
    reload_cmd = ~/.config/hypr/scripts/hyprlock-music.sh art

    position = -125, -330

    halign = center
    valign = center

    shadow_passes = 5
    shadow_size = 12
    shadow_color = rgb(29, 32, 33)
}


# ─────────────────────────────────────────────────────────────
# TRACK TITLE
# ─────────────────────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:1000] ~/.config/hypr/scripts/hyprlock-music.sh title

    color = rgb(235, 219, 178)

    font_size = 13
    font_family = JetBrainsMono Nerd Font

    text_align = center

    position = 45, -290

    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(29, 32, 33)
}


# ─────────────────────────────────────────────────────────────
# ARTIST
# ─────────────────────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:1000] ~/.config/hypr/scripts/hyprlock-music.sh artist

    color = rgb(213, 196, 161)

    font_size = 10
    font_family = JetBrainsMono Nerd Font

    text_align = center

    position = 45, -313

    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgb(29, 32, 33)
}


# ─────────────────────────────────────────────────────────────
# PLAYBACK STATUS
# ─────────────────────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:1000] ~/.config/hypr/scripts/hyprlock-music.sh status

    color = rgb(131, 165, 152)

    font_size = 9
    font_family = JetBrainsMono Nerd Font

    position = 45, -335

    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(29, 32, 33)
}


# ─────────────────────────────────────────────────────────────
# PREVIOUS
# ─────────────────────────────────────────────────────────────

label {
    monitor =

    text = 󰒮

    color = rgb(213, 196, 161)

    font_size = 22
    font_family = JetBrainsMono Nerd Font

    onclick = playerctl previous

    position = 5, -365

    halign = center
    valign = center
}


# ─────────────────────────────────────────────────────────────
# PLAY / PAUSE
# ─────────────────────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:1000] sh -c 'if [ "$(playerctl status 2>/dev/null)" = "Playing" ]; then printf "󰏤"; else printf "󰐊"; fi'

    color = rgb(250, 189, 47)

    font_size = 26
    font_family = JetBrainsMono Nerd Font

    onclick = playerctl play-pause

    position = 45, -365

    halign = center
    valign = center
}


# ─────────────────────────────────────────────────────────────
# NEXT
# ─────────────────────────────────────────────────────────────

label {
    monitor =

    text = 󰒭

    color = rgb(213, 196, 161)

    font_size = 22
    font_family = JetBrainsMono Nerd Font

    onclick = playerctl next

    position = 85, -365

    halign = center
    valign = center
}
